name: Compilar APK Android

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v6
      - name: Preparar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3
      - name: Instalar SDK del proyecto
        run: sdkmanager "platforms;android-36.1" "build-tools;36.0.0"
      - name: Preparar Gradle y verificar wrapper
        uses: gradle/actions/setup-gradle@v6
      - name: Dar permiso al wrapper
        run: chmod +x gradlew
      - name: Compilar APK de prueba
        run: ./gradlew --no-daemon :app:assembleDebug --stacktrace
      - name: Guardar APK descargable
        uses: actions/upload-artifact@v7
        with:
          name: AprendeLS-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
